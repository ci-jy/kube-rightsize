[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kube-rightsize"
version = "0.1.0"
description = "Recommend Kubernetes CPU and memory requests from observed Prometheus usage"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7", "hypothesis>=6"]

[project.scripts]
rightsize = "rightsize.cli:main"

[tool.setuptools]
packages = ["rightsize"]

[tool.pytest.ini_options]
testpaths = ["tests"]
